[project]
name = "biotelemetry-health-monitoring-space"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "supabase>=2.4.0",
    "numpy>=1.26.0",
    "mangum>=0.17.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "edge-tts>=7.3.0",
]

[tool.vercel]
entrypoint = "serverless.index:app"
